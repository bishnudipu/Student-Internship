<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Main circle border -->
  <circle cx="50" cy="50" r="45" stroke="url(#logoGradient)" stroke-width="3" fill="none"/>
  
  <!-- Brain/Neural network pattern -->
  <circle cx="35" cy="35" r="6" fill="url(#logoGradient)"/>
  <circle cx="65" cy="35" r="6" fill="url(#logoGradient)"/>
  <circle cx="50" cy="50" r="8" fill="url(#logoGradient)"/>
  <circle cx="35" cy="65" r="6" fill="url(#logoGradient)"/>
  <circle cx="65" cy="65" r="6" fill="url(#logoGradient)"/>
  
  <!-- Connecting lines -->
  <line x1="35" y1="35" x2="50" y2="50" stroke="url(#innerGradient)" stroke-width="2"/>
  <line x1="65" y1="35" x2="50" y2="50" stroke="url(#innerGradient)" stroke-width="2"/>
  <line x1="35" y1="65" x2="50" y2="50" stroke="url(#innerGradient)" stroke-width="2"/>
  <line x1="65" y1="65" x2="50" y2="50" stroke="url(#innerGradient)" stroke-width="2"/>
  <line x1="35" y1="35" x2="65" y2="35" stroke="url(#innerGradient)" stroke-width="1.5" opacity="0.5"/>
  <line x1="35" y1="65" x2="65" y2="65" stroke="url(#innerGradient)" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Tech accent - circuit lines -->
  <path d="M 20 50 L 30 50" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 70 50 L 80 50" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="50" r="2" fill="url(#logoGradient)"/>
  <circle cx="80" cy="50" r="2" fill="url(#logoGradient)"/>
</svg>
